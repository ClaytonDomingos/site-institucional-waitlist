    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="Seja Seu Guia · O mundo do seu jeito" />

    <meta name="twitter:card" content="summary_large_image" />
    <!-- ainda sem logo: ícone vazio (o navegador não pede /favicon.ico) -->
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="preconnect" href="https://images.unsplash.com" />
    <script>
      /* aplica o tema salvo antes da primeira pintura (sem piscar branco no escuro) */
      try {
        if (localStorage.getItem("proto-theme") === "dark") {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      } catch {}
    </script>
